name = "nameless-telemetry"
main = "worker.js"
compatibility_date = "2026-01-20"
workers_dev = false
send_metrics = false

routes = [
  { pattern = "telemetry.namelessnanashi.dev/*", zone_name = "namelessnanashi.dev" },
  { pattern = "census.namelessnanashi.dev/*", zone_name = "namelessnanashi.dev" }
]

[[kv_namespaces]]
binding = "TELEMETRY"
id = "c84deb2f62574d3bb1e54a41522e2d95"

[observability]
enabled = false

[placement]
mode = "smart"

# Per-IP rate limit for POST /census (Workers Rate Limiting; period must be 10 or 60 seconds).
# 60/min stops floods while leaving room for many installs behind one shared IP (NAT, CGNAT, CI).
[[ratelimits]]
name = "CENSUS_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
